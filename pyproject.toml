[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bblocks-specgen"
version = "0.1.0"
description = "OGC standards document generator from Building Blocks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "jinja2>=3",
    "markdown-it-py>=3",
    "requests>=2.31",
    "jsonpath-ng>=1.6",
]

[project.scripts]
bblocks-specgen = "standard_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
standard_gen = ["templates/*"]
